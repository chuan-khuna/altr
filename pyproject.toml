[project]
name = "altr"
version = "0.1.2"
description = "The code snippet for ALTR(my alias)"
classifiers = ["Private :: Do Not Upload"]
readme = "README.md"
authors = [{ name = "ALTR", email = "chuan.khuna@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "gensim>=4.4",
    "matplotlib>=3.10.1",
    "numpy>=2.4",
    "pandas>=2.2.3",
    "pymonad>=2.4.0",
    "seaborn>=0.13.2",
    "termcolor>=3.3.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
nlp = [
    "gensim>=4.4",
    "nltk>=3.9.1",
    "pythainlp>=5.1.1",
    "wordcloud>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "gensim>=4.4",
    "jupyterlab>=4.4.1",
    "nltk>=3.9.1",
    "pytest>=8.3.5",
    "pythainlp>=5.1.1",
    "wordcloud>=1.9.4",
]
